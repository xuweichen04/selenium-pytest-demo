name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Chrome and ChromeDriver
        run: |
          # 安装 Chrome
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # 获取 Chrome 版本
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          echo "Chrome version: $CHROME_VERSION"
          
          # 下载对应版本的 ChromeDriver
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
          wget -O /tmp/chromedriver.zip "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          
          # 如果上面链接失败，使用替代方法
          if [ $? -ne 0 ]; then
            wget -O /tmp/chromedriver.zip "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          fi
          
          # 解压并放到代码期望的路径
          unzip /tmp/chromedriver.zip -d /tmp/
          sudo mkdir -p /c/python/
          sudo cp /tmp/chromedriver-linux64/chromedriver /c/python/chromedriver.exe
          sudo chmod +x /c/python/chromedriver.exe
          
          # 验证安装
          /c/python/chromedriver.exe --version

      - name: Run tests
        run: |
          pytest tests/ --browser chrome --headless